[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya"
version = "0.3.5"
description = "Fast, non-autoregressive System 1 decision engine with calibrated probabilities"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Convai Innovations" }
]
keywords = ["decision-model", "rlcd", "calibration", "system-one", "routing", "guardrails", "moderation", "triage"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# LFM2 backbones (e.g. LiquidAI/LFM2.5-Encoder-230M) need transformers' native
# lfm2 support, which starts in 4.55. The base floor stays at ModernBERT's 4.48.
lfm2 = ["transformers>=4.55.0"]

[tool.setuptools]
# assets/, research/ and notebooks/ sit in the root, so auto-discovery bails out.
packages = ["laya"]

[tool.ruff]
# Matches the wide render/comment style the codebase was written against.
line-length = 120
# laya/, tests/ and setup.py; research/ and notebooks/ are exploratory and untracked by CI.
include = ["laya/*.py", "tests/*.py", "setup.py"]

[tool.ruff.lint]
# Full pycodestyle errors + pyflakes + import sorting. Deliberately not the
# modernization/simplification families: the codebase targets old transformers
# floors (py3.10, transformers 4.48) where UP-style rewrites break compatibility.
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
# Same scope as ruff/CI: the shipped package and its tests. research/ and
# notebooks/ are exploratory and pull optional deps (datasets, ...), so type
# checking them would flag imports CI never exercises.
include = ["laya", "tests", "setup.py"]

[project.urls]
Homepage = "https://huggingface.co/convaiinnovations/laya"
Demo = "https://huggingface.co/spaces/convaiinnovations/laya-demo"
